# Render Blueprint: creates the API, its Postgres database and its secrets in
# one step (Render dashboard → New → Blueprint → pick this repo).
services:
  - type: web
    name: campus-os-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Tables first, demo data only on an empty database, then the server.
    startCommand: npx prisma migrate deploy && node scripts/seed-if-empty.mjs && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-os-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://campus-os-lime.vercel.app
      - key: TURNSTILE_ORIGINS
        value: https://campus-os-lime.vercel.app

databases:
  - name: campus-os-db
    databaseName: campusos
    user: campus
    plan: free
