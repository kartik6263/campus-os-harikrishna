# Render Blueprint (Render dashboard → New → Blueprint → pick this repo).
# The database is on Neon; Render asks for its connection string on setup.
services:
  - type: web
    name: campus-os-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Tables first, demo data only on an empty database, then the server.
    startCommand: npx prisma migrate deploy && node scripts/seed-if-empty.mjs && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon's direct (non-pooled) connection string, ending ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://campus-os-lime.vercel.app
      - key: TURNSTILE_ORIGINS
        value: https://campus-os-lime.vercel.app
