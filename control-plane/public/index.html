<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resolion Control Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#16264A; --muted:#5A6577; --rule:#D3D8E0; --bg:#EDEFF3; --card:#fff; --accent:#E0952A; --ok:#0E7A5F; --bad:#A8242C; --warn:#8A6D1F; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header { background:var(--ink); color:#fff; padding:0 20px; height:52px; display:flex; align-items:center; gap:12px; }
  header .mark { background:var(--accent); width:28px; height:28px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12px; }
  header .sub { color:rgba(255,255,255,.55); font-size:12px; }
  header button { margin-left:auto; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px; }
  .card { background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:16px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; font-size:12px; font-weight:500; margin-bottom:4px; }
  input, select { width:100%; height:36px; padding:0 10px; border:1px solid var(--rule); border-radius:4px; font:inherit; background:#fff; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { height:34px; padding:0 14px; border-radius:4px; border:1px solid var(--rule); background:#fff; color:var(--ink); font:inherit; font-weight:500; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; align-items:end; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--rule); vertical-align:top; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; }
  tr.row { cursor:pointer; } tr.row:hover { background:#F6F7F9; }
  .mono { font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .s-active { background:#E3F4EE; color:var(--ok); } .s-failed { background:#FDE8E8; color:var(--bad); }
  .s-suspended { background:#EEF0F3; color:var(--muted); } .s-provisioning, .s-deploying, .s-deleting { background:#FEF3DD; color:var(--warn); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .err { color:var(--bad); font-size:13px; margin-top:8px; }
  .events { max-height:260px; overflow:auto; font-size:12px; }
  .events div { padding:4px 0; border-bottom:1px dashed var(--rule); }
  .lvl-error { color:var(--bad); } .lvl-warn { color:var(--warn); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .note { background:#FEF9EC; border:1px solid #F3DDA8; border-radius:4px; padding:10px 12px; font-size:13px; margin-bottom:16px; }
  #login { max-width:360px; margin:12vh auto; }
  @media (max-width:640px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <div class="mark">R</div>
  <div><div style="font-weight:600">Resolion Control Plane</div><div class="sub">Institutes · provisioning · health</div></div>
  <button id="logout" hidden>Sign out</button>
</header>

<main>
  <div id="login" class="card" hidden>
    <h2>Owner sign-in</h2>
    <form id="loginForm">
      <label for="pw">Control-plane password</label>
      <input id="pw" type="password" autocomplete="current-password" required />
      <div class="actions"><button class="primary" type="submit">Sign in</button></div>
      <div id="loginErr" class="err"></div>
    </form>
  </div>

  <div id="app" hidden>
    <div id="modeNote" class="note" hidden></div>

    <div class="card">
      <h2>New institute</h2>
      <form id="newForm" class="grid">
        <div><label>Institute name</label><input name="name" required placeholder="Sunrise Public School" /></div>
        <div><label>Address (subdomain)</label><input name="slug" required placeholder="sunrise" pattern="[a-z][a-z0-9-]{1,28}[a-z0-9]" title="3–30 lowercase letters, numbers or hyphens" /></div>
        <div><label>Type</label><select name="kind"><option>University</option><option>College</option><option>School</option><option>Institute</option><option>Academy</option><option>Other</option></select></div>
        <div><label>Short code (optional)</label><input name="shortCode" maxlength="6" placeholder="SPS" /></div>
        <div><button class="primary" type="submit" id="createBtn">Create institute</button></div>
      </form>
      <div id="newErr" class="err"></div>
    </div>

    <div class="card">
      <h2>Institutes <span id="count" class="muted"></span></h2>
      <table>
        <thead><tr><th>Institute</th><th>Status</th><th>Health</th><th class="hide-sm">Backend</th><th class="hide-sm">Created</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="muted" hidden>No institutes yet. Create the first one above.</p>
    </div>

    <div id="detail" class="card" hidden></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let token = sessionStorage.getItem('rcp.token');
let selected = null;
let timer = null;

async function call(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) } });
  if (res.status === 401 && path !== '/api/login') { signOut(); throw new Error('Signed out'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const when = (d) => d ? new Date(d).toLocaleString() : '—';

function signOut() { token = null; sessionStorage.removeItem('rcp.token'); show(); }
function show() {
  $('#login').hidden = !!token; $('#app').hidden = !token; $('#logout').hidden = !token;
  if (token) refresh();
}

$('#loginForm').onsubmit = async (e) => {
  e.preventDefault(); $('#loginErr').textContent = '';
  try { token = (await call('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) })).token; sessionStorage.setItem('rcp.token', token); $('#pw').value = ''; show(); }
  catch (err) { $('#loginErr').textContent = err.message; }
};
$('#logout').onclick = signOut;

$('#newForm').onsubmit = async (e) => {
  e.preventDefault(); $('#newErr').textContent = '';
  const f = Object.fromEntries(new FormData(e.target));
  if (!f.shortCode) delete f.shortCode;
  $('#createBtn').disabled = true;
  try { const t = await call('/api/tenants', { method: 'POST', body: JSON.stringify(f) }); e.target.reset(); selected = t.slug; await refresh(); }
  catch (err) { $('#newErr').textContent = err.message; }
  finally { $('#createBtn').disabled = false; }
};

async function refresh() {
  const data = await call('/api/tenants');
  const note = $('#modeNote');
  note.hidden = false;
  note.innerHTML = data.provisioner === 'local'
    ? '<b>Local test mode.</b> Institutes run as processes on this machine against the local Postgres. Set PROVISIONER=cloud with Neon and Render keys for real deployments.'
    : `<b>Cloud mode.</b> Each institute gets its own Neon database and Render backend${data.baseDomain ? `, at &lt;address&gt;.${esc(data.baseDomain)}` : ' (no domain yet: sites open with ?tenant=&lt;address&gt;)'}.`;
  $('#count').textContent = `(${data.tenants.length})`;
  $('#empty').hidden = data.tenants.length > 0;
  $('#rows').innerHTML = data.tenants.map((t) => `
    <tr class="row" data-slug="${esc(t.slug)}">
      <td><div style="font-weight:500">${esc(t.name)}</div><div class="mono muted">${esc(t.slug)} · ${esc(t.kind)}</div></td>
      <td><span class="pill s-${esc(t.status)}">${esc(t.status)}</span></td>
      <td>${t.healthOk === null ? '<span class="muted">—</span>' : `<span class="dot" style="background:${t.healthOk ? 'var(--ok)' : 'var(--bad)'}"></span>${t.healthOk ? 'up' : 'down'}`}</td>
      <td class="hide-sm mono muted">${esc(t.apiUrl ?? '—')}</td>
      <td class="hide-sm muted">${when(t.createdAt)}</td>
    </tr>`).join('');
  document.querySelectorAll('tr.row').forEach((tr) => tr.onclick = () => { selected = tr.dataset.slug; detail(); });
  if (selected) await detail();
  const busy = data.tenants.some((t) => ['provisioning', 'deploying', 'deleting'].includes(t.status));
  clearTimeout(timer); timer = setTimeout(() => token && refresh().catch(() => {}), busy ? 3000 : 30000);
}

async function detail() {
  const box = $('#detail');
  let t;
  try { t = await call('/api/tenants/' + encodeURIComponent(selected)); } catch { box.hidden = true; selected = null; return; }
  box.hidden = false;
  box.innerHTML = `
    <h2>${esc(t.name)} <span class="pill s-${esc(t.status)}">${esc(t.status)}</span></h2>
    <div class="grid" style="align-items:start">
      <div><div class="muted">Site (IT Cell sets up here)</div><a href="${esc(t.webUrl)}" target="_blank" rel="noreferrer" class="mono">${esc(t.webUrl)}</a></div>
      <div><div class="muted">Backend</div><div class="mono">${esc(t.apiUrl ?? '—')}</div></div>
      <div><div class="muted">Database</div><div class="mono">${esc(t.dbName ?? '—')}</div></div>
      <div><div class="muted">Provider</div><div>${esc(t.provider)}${t.serviceId ? ` · <span class="mono">${esc(t.serviceId)}</span>` : ''}</div></div>
    </div>
    ${t.error ? `<div class="err">${esc(t.error)}</div>` : ''}
    <div class="actions">
      ${t.status === 'failed' ? '<button class="primary" data-act="retry">Retry</button>' : ''}
      ${t.status === 'active' ? '<button data-act="check">Check health now</button><button data-act="suspend">Suspend</button>' : ''}
      ${t.status === 'suspended' ? '<button class="primary" data-act="resume">Resume</button>' : ''}
      <button class="danger" data-act="delete">Delete institute…</button>
    </div>
    <h2 style="margin-top:16px">Activity</h2>
    <div class="events">${t.events.map((e) => `<div class="lvl-${esc(e.level)}"><span class="muted">${when(e.at)}</span> — ${esc(e.message)}</div>`).join('')}</div>`;
  box.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(t, b.dataset.act));
}

async function act(t, action) {
  try {
    if (action === 'delete') {
      const typed = prompt(`This deletes ${t.name}'s backend AND database — all of its data. Type "${t.slug}" to confirm.`);
      if (typed !== t.slug) return;
      await call('/api/tenants/' + t.slug, { method: 'DELETE', body: JSON.stringify({ confirm: typed }) });
      selected = null; $('#detail').hidden = true;
    } else {
      await call(`/api/tenants/${t.slug}/${action}`, { method: 'POST' });
    }
    await refresh();
  } catch (err) { alert(err.message); }
}

show();
</script>
</body>
</html>
